
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="menu">Home</a>
        <nav class="menu">
            <a href="cadastro.html">Cadastro</a>
            <a href="login.html">Login</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </header>
    <main>
    <h1>Cadastro</h1>
    <form action="#" method="POST">
        <label for="id-cliente" style="color: #333; font-weight: bold;">
            ID do cliente
        </label>
        <input type="text" id="id-cliente" name="id-cliente">
        <label for="nome">Nome:</label>
        <input 
            type="text" 
            id="nome" 
            name="nome" 
            placeholder="Digite seu nome completo"
            required
        ><br><br>
       
        <label for="cpf">CPF:</label>
        <input
            type="text"
            id="cpf"
            name="cpf"
            placeholder="000.000.000-00"
            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
            title="Digite o CPF válido no formato 000.000.000-00"
            maxlength="14"
            autocomplete="off"
            required
        >
        <br><br>

        <label for="email">Email:</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="exemplo@email.com"
            required
        >
        <br><br>

        <label for="senha">Senha:</label>
        <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Crie uma senha"
            minlength="8"
            autocomplete="new-password"
            required
        >
        <label for="confirmar-senha">Confirmar senha:</label>
        <input
            type="password"
            id="confirmar-senha"
            name="confirmar-senha"
            placeholder="Digite a senha novamente"
            minlength="8"
            autocomplete="new-password"
            required
        ><br><br>
        <button type="submit" value="Cadastrar">Cadastrar</button>
    </form>
    </main>
    <footer class="rodape">
        <p>Schmidt Auto Peças — Loja virtual</p>
        <p>Todos os direitos reservados © 2026</p>
    </footer>
</body>
</html>
