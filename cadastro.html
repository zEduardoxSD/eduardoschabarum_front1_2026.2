<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Schmidt Auto Peças</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="menu">Home</a>
        <nav class="menu" id="menu-dinamico">
            <a href="cadastro.html">Cadastro</a>
            <a href="login.html">Login</a>
            <a href="perfil.html">Perfil</a>
            <a href="relatorios.html">Relatórios</a>
        </nav>
    </header>
    <main>
        <h1>Cadastro</h1>
        <!-- Adicionado id="form-cadastro" e novalidate (para o JS assumir as validações) -->
        <form id="form-cadastro" action="#" method="POST" novalidate>
            <label for="id-cliente" style="color: #333; font-weight: bold;">
                ID do cliente
            </label>
            <input type="text" id="id-cliente" name="id-cliente" readonly>
            <br><br>

            <label for="nome">Nome:</label>
            <input 
                type="text" 
                id="nome" 
                name="nome" 
                placeholder="Digite seu nome completo"
                required
            >
            <small class="erro-msg" data-erro="nome" style="color: red; display: block;"></small>
            <br>
           
            <label for="cpf">CPF:</label>
            <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="000.000.000-00"
                maxlength="14"
                autocomplete="off"
                required
            >
            <small class="erro-msg" data-erro="cpf" style="color: red; display: block;"></small>
            <br>

            <label for="email">Email:</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="exemplo@email.com"
                required
            >
            <small class="erro-msg" data-erro="email" style="color: red; display: block;"></small>
            <br>

            <label for="telefone">Telefone:</label>
            <input 
                type="tel" 
                id="telefone" 
                name="telefone" 
                placeholder="Somente números (ex: 48999999999)"
                maxlength="11"
                required
            >
            <small class="erro-msg" data-erro="telefone" style="color: red; display: block;"></small>
            <br>

            <label for="senha">Senha:</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Crie uma senha"
                autocomplete="new-password"
                required
            >
            <div id="forca-senha" style="font-size: 0.9em; margin-top: 4px;">Força da senha: <span>-</span></div>
            <small class="erro-msg" data-erro="senha" style="color: red; display: block;"></small>
            <br>

            <label for="confirmar-senha">Confirmar senha:</label>
            <input
                type="password"
                id="confirmar-senha"
                name="confirmar-senha"
                placeholder="Digite a senha novamente"
                autocomplete="new-password"
                required
            >
            <small class="erro-msg" data-erro="confirmar-senha" style="color: red; display: block;"></small>
            <br>

            <button type="submit">Cadastrar</button>
        </form>
    </main>
    <footer class="rodape">
        <p>Schmidt Auto Peças — Loja virtual</p>
        <p>Todos os direitos reservados © 2026</p>
    </footer>

    <script type="module">
        import { clientesManager } from './js/clientes.js';
        import { uiManager } from './js/ui.js';

        uiManager.inicializarTema();
        uiManager.atualizarMenuDinamico();
        clientesManager.inicializarCadastro();
    </script>
</body>
</html>
