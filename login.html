<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <img src="./imagens/autoparts.jpeg" alt="logo" class="logo">
        <a href="index.html" class="home">Home</a>
        <nav class="menu" id="menu-dinamico">
            <a href="cadastro.html">Cadastro</a>
            <a href="login.html">Login</a>
            <a href="perfil.html">Perfil</a>
            <a href="relatorios.html">Relatórios</a>
        </nav>
    </header>
    <main>
        <h1>Login</h1>
        <form id="form-login" action="#" method="POST" novalidate>
            <label for="email">Email:</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="Digite seu email"
                required
            >
            <label for="senha">Senha:</label>
            <input 
                type="password" 
                id="senha" 
                name="senha" 
                placeholder="Digite sua senha"
                required
            >
            <small id="login-erro" style="color: red; display: block; margin-bottom: 10px;"></small>
            <button type="submit">Entrar</button>
        </form>
    </main>
    <footer class="rodape">
        <p>Schmidt Auto Peças — Loja virtual</p>
        <p>Todos os direitos reservados © 2026</p>
    </footer>

    <script type="module">
        import { loginController } from './js/login.js';
        import { uiManager } from './js/ui.js';

        uiManager.inicializarTema();
        uiManager.atualizarMenuDinamico();
        loginController.inicializar();
    </script>
</body>
</html>
